version: 2

updates:
  # GitHub Actions pinned in .github/workflows/ (ci.yml and skills-ci.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"

  # The pnpm workspace: one lockfile at the root covers every app and package.
  # Minor and patch bumps arrive as one grouped PR; majors stay separate so
  # each gets its own review.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # Base images in the app Dockerfiles (node, nginx-unprivileged).
  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/worker"
      - "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  # Service images in compose.yaml (pgvector, redis, ollama).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"

  # Pinned lint/test tooling for the scripts under .claude/skills/, in
  # requirements-dev.txt. Not the application's stack.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "tooling"
