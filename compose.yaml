# Opinionated Recipes — the whole stack.
#
#   cp .env.example .env        # then set RECIPES_POSTGRES_PASSWORD at minimum
#   docker compose up -d --build
#   open http://localhost:8080
#
# Behind an existing Traefik instead of a host port:
#   docker compose -f compose.yaml -f compose.traefik.yaml up -d --build
# (or set COMPOSE_FILE=compose.yaml:compose.traefik.yaml in .env)
#
# Local Ollama in this stack (off by default, since it usually lives on a GPU
# box elsewhere and RECIPES_OLLAMA_URL points there):
#   docker compose --profile ollama up -d

name: opinionated-recipes

x-app: &app
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  # Service addresses inside this network win over anything in .env, which is
  # usually written for running the apps directly on the host.
  environment: &app-environment
    RECIPES_DATABASE_URL: postgres://${RECIPES_POSTGRES_USER:-recipes}:${RECIPES_POSTGRES_PASSWORD:?Set RECIPES_POSTGRES_PASSWORD in .env}@postgres:5432/${RECIPES_POSTGRES_DB:-recipes}
    RECIPES_REDIS_URL: redis://redis:6379
    RECIPES_OLLAMA_URL: ${RECIPES_OLLAMA_URL:-http://ollama:11434}
    RECIPES_API_PORT: ${RECIPES_API_PORT:-3000}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      RECIPES_API_PORT: ${RECIPES_API_PORT:-3000}
    ports:
      - ${RECIPES_HTTP_BIND:-127.0.0.1}:${RECIPES_HTTP_PORT:-8080}:8080
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + (process.env.RECIPES_API_PORT || 3000) + '/api/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    <<: *app
    build:
      context: .
      dockerfile: apps/worker/Dockerfile

  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RECIPES_POSTGRES_USER:-recipes}
      POSTGRES_PASSWORD: ${RECIPES_POSTGRES_PASSWORD:?Set RECIPES_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${RECIPES_POSTGRES_DB:-recipes}
    volumes:
      # Postgres 18 images keep data under a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # BullMQ requires noeviction: an evicted key is a silently lost job.
    command: [redis-server, --appendonly, "yes", --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.34.4
    profiles: [ollama]
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # GPU passthrough is host-specific; add it in compose.override.yaml, e.g.
    #   services: { ollama: { gpus: all } }

volumes:
  postgres-data:
  redis-data:
  ollama-data:
